<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev Apply · 网申助手</title><link rel="stylesheet" href="shared.css"></head><body><main>
<div class="eyebrow">RESUME FILL · DEEPSEEK / JEV</div><h1>少填几遍简历。</h1><p class="muted">扫描当前页，核对每一项，再填入网页。</p>
<section class="card"><div class="row between"><h2>1 · 准备资料</h2><button id="edit-profile" class="small">资料 / PDF / TXT</button></div><p id="profile-info" class="muted">正在读取…</p><label for="provider">识别服务<select id="provider"><option value="jev">Jev · 字段与选项映射</option><option value="deepseek">DeepSeek · 读取素材并生成填写计划</option></select></label><p id="provider-model" class="muted"></p><details><summary>设置当前服务的 API key</summary><label for="api-key">官方 API key<input id="api-key" type="password" autocomplete="off" placeholder="本地持久保存，可输入新密钥替换"></label><div class="row" style="margin-top:10px"><button id="save-key" class="small">保存到本机</button><button id="clear-key" class="small">清除</button><span id="key-info" class="muted"></span></div></details></section>
<section class="card"><h2>2 · 识别网页</h2><div class="row"><button id="scan" class="primary">扫描当前页</button><button id="match" disabled>Jev 智能匹配</button></div><p id="data-notice" class="muted"></p><p id="page-info" class="muted"></p></section>
<div id="status" class="status" role="status" aria-live="polite">先保存个人资料，再到网申页面点击扩展图标。</div>
<section class="card" id="preview" hidden><div class="row between"><h2>3 · 核对待填内容</h2><span id="count" class="tag"></span></div><p class="muted">请核对资料映射和待填值。DeepSeek 建议附带资料出处，内容可以修改；无法确定或不支持的字段留给你处理。</p><div id="fields"></div></section>
<div class="actions"><label class="check"><input id="overwrite" type="checkbox">允许覆盖已有内容（默认跳过）</label><button id="fill" class="primary" style="width:100%;margin-top:10px" disabled>填入勾选项</button><p class="muted">不会点击“下一步”或“提交”，不会勾选同意条款，也不会上传附件。每页填完请自行检查。</p><small id="usage"></small></div>
</main><script type="module" src="panel.js"></script></body></html>
